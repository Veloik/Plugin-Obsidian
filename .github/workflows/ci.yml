name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The dedicated release check handles dependency findings; avoid a duplicate
      # advisory request during installation when npm's audit service is down.
      - run: npm ci --no-audit
      - run: npm run release:check
      - name: Ensure generated bundle is committed
        run: git diff --exit-code -- main.js
