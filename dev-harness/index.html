<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NoteLens harness</title>
<style>
  :root {
    --text-normal: #dcddde; --text-muted: #999; --text-faint: #666; --text-on-accent: #fff;
    --interactive-accent: #7f6df2; --background-primary: #202020; --background-primary-alt: #1a1a1a;
    --background-secondary: #161616; --background-modifier-border: #333; --font-monospace: Consolas, monospace;
    --font-text: -apple-system, "Segoe UI", sans-serif; --font-interface: -apple-system, "Segoe UI", sans-serif;
    --radius-s: 4px; --radius-m: 8px; --size-4-2: 8px;
  }
  html, body { margin: 0; height: 100%; background: #202020; color: var(--text-normal); font-family: var(--font-interface); font-size: 14px; }
  .view-container { position: absolute; inset: 0; display: flex; flex-direction: column; }
  /* Obsidian's own mobile chrome, reproduced so a run can see what it covers:
     a header that takes space and a navigation bar that floats over the view. */
  body.has-mobile-chrome .view-container { top: var(--chrome-header, 0px); }
  #obsidian-header {
    position: absolute; top: 0; left: 0; right: 0; height: var(--chrome-header, 0px);
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #dcddde; font-weight: 700; z-index: 9000;
  }
  #obsidian-navbar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: var(--chrome-navbar-gap, 10px); width: min(78%, 420px); height: var(--chrome-navbar, 0px);
    border-radius: 999px; background: rgba(58, 58, 60, 0.92); z-index: 9000;
    display: flex; align-items: center; justify-content: space-around; color: #d1d1d6;
  }
  .view-header { height: 0; }
  .view-content { flex: 1; position: relative; overflow: hidden; }
  .svg-icon { width: 18px; height: 18px; }
  button { font: inherit; }
  .notice { position: fixed; right: 12px; top: 12px; background: #333; color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 5000; }
  .menu { position: fixed; background: #262626; border: 1px solid #444; border-radius: 6px; padding: 4px; z-index: 5000; }
  .menu-item { display: flex; gap: 8px; padding: 6px 10px; cursor: pointer; }
  .menu-item:hover { background: #3a3a3a; }
  .modal-container { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; z-index: 6000; }
  .modal { background: #262626; border-radius: 8px; padding: 16px; min-width: 380px; }
</style>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>window.MathJax = { tex: { inlineMath: [["$","$"]] }, startup: { typeset: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" data-manual></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
<script src="shim.js"></script>
<script>
  window.module = { exports: {} };
  window.exports = window.module.exports;
  window.require = (name) => {
    if (name === "obsidian") return window.__obsidian;
    throw new Error("harness: module not available: " + name);
  };
</script>
<script src="../main.js"></script>
<script>
(async () => {
  const O = window.__obsidian;
  const PluginClass = window.module.exports.default || window.module.exports;
  const file = new window.__TFile("Pizarra_prueba.notelens");
  window.__saved = null;
  window.__workspaceHandlers = {};
  window.__created = [];
  const app = {
    vault: {
      read: async () => "",
      modify: async (f, content) => { window.__saved = content; },
      create: async (p, c) => { window.__created.push(p); return new window.__TFile(p); },
      createBinary: async (p) => new window.__TFile(p),
      createFolder: async () => {},
      readBinary: async () => new ArrayBuffer(0),
      getAbstractFileByPath: () => null,
      getFiles: () => [],
      getResourcePath: (f) => f.path,
      adapter: { getResourcePath: (p) => p, exists: async () => false }
    },
    workspace: {
      getActiveViewOfType: () => window.__view,
      getLeaf: () => ({ openFile: async (f) => { window.__opened = f; } }),
      openLinkText: () => {},
      // Workspace events the plugin subscribes to, kept so a run can fire them.
      on: (name, fn) => { (window.__workspaceHandlers[name] ||= []).push(fn); return { name, fn }; },
      offref: () => {},
      activeLeaf: null
    },
    loadLocalStorage: (key) => { try { return JSON.parse(localStorage.getItem("harness:" + key) ?? "null"); } catch { return null; } },
    saveLocalStorage: (key, value) => { try { localStorage.setItem("harness:" + key, JSON.stringify(value)); } catch {} },
    fileManager: { getAvailablePathForAttachment: async (n) => "attachments/" + n },
    metadataCache: { getFirstLinkpathDest: () => null }
  };
  const plugin = new PluginClass(app, { id: "notelens", dir: ".obsidian/plugins/notelens", version: "test" });
  await plugin.onload();
  const factory = Object.values(plugin.views)[0];
  const leaf = { app, view: null };
  const view = factory(leaf);
  window.__view = view;
  // Enough of the workspace API for the plugin to refresh open boards.
  app.workspace.getLeavesOfType = (type) => (type === "notelens-canvas-view" || type === view.getViewType?.()) ? [{ view }] : [];
  window.__assistantTest = window.module.exports.__assistantTest || null;
  // Optional: the header and floating navigation bar Obsidian draws on a phone.
  if (window.__mobileChrome) {
    const chrome = window.__mobileChrome;
    document.body.classList.add("has-mobile-chrome");
    document.body.style.setProperty("--chrome-header", `${chrome.header ?? 92}px`);
    document.body.style.setProperty("--chrome-navbar", `${chrome.navbar ?? 56}px`);
    document.body.style.setProperty("--chrome-navbar-gap", `${chrome.navbarGap ?? 12}px`);
    const header = document.body.createDiv();
    header.id = "obsidian-header";
    header.setText(file.basename);
    // The real app calls it .mobile-navbar; the view measures it by that name.
    const navbar = document.body.createDiv({ cls: "mobile-navbar" });
    navbar.id = "obsidian-navbar";
    for (const glyph of ["‹", "›", "○", "+", "▣", "≡"]) navbar.createSpan({ text: glyph });
  }
  document.body.appendChild(view.containerEl);
  await view.onOpen();
  await view.onLoadFile(file);
  window.__ready = true;
})().catch(e => { console.error("HARNESS BOOT FAILED", e); window.__bootError = String(e && e.stack || e); });
</script>
</body>
</html>
